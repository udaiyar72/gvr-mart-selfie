
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVR MART Selfie Booth</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:linear-gradient(135deg,#063b23,#087447);
 color:white;text-align:center;
 font-family:Arial,sans-serif;
}
.card{
 max-width:430px;margin:auto;
 background:#fff;color:#164b31;
 padding:20px;border-radius:24px;
 box-shadow:0 8px 30px #001b13;
}
h1{color:#087447;font-size:34px;margin:8px}
.gold{color:#c69524}
p{font-size:14px}
.cameraBox{
 border:6px solid #d5aa40;
 border-radius:18px;padding:5px;
 overflow:hidden;background:#063b23;
}
video,img{
 width:100%;display:block;
 border-radius:12px;
}
button{
 border:0;border-radius:30px;
 padding:14px 17px;margin:7px;
 background:#087447;color:white;
 font-weight:bold;font-size:15px;
}
.goldbtn{background:#d5aa40;color:#173b25}
canvas{display:none}
#result{margin-top:12px}
footer{color:#d5aa40;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>GVR MART 🥬</h1>
<h2 class="gold">SCAN TO SNAP A SELFIE!</h2>
<p>Fresh Fruits & Vegetables</p>
<p>Farmer Support ❤️ Chennai</p>

<div class="cameraBox">
<video id="video" autoplay playsinline></video>
</div>

<button onclick="startCamera()">OPEN CAMERA</button>
<button class="goldbtn" onclick="takePhoto()">📸 TAKE SELFIE</button>

<canvas id="canvas"></canvas>
<img id="result" hidden>

<div>
<button onclick="downloadPhoto()">DOWNLOAD PHOTO</button>
<button class="goldbtn" onclick="sharePhoto()">SHARE PHOTO</button>
</div>

<p>Capture Your Lucky Moment!</p>
<footer>GVR MART – FROM FARM TO YOUR DOORSTEP</footer>
</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const result=document.getElementById("result");
let stream=null;

async function startCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"user"},audio:false
  });
  video.srcObject=stream;
 }catch(e){
  alert("Please allow camera permission.");
 }
}

function takePhoto(){
 if(!stream){
  alert("Please open camera first!");
  return;
 }
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 const ctx=canvas.getContext("2d");
 ctx.save();
 ctx.translate(canvas.width,0);
 ctx.scale(-1,1);
 ctx.drawImage(video,0,0,canvas.width,canvas.height);
 ctx.restore();

 ctx.fillStyle="#07512f";
 ctx.fillRect(0,canvas.height-100,canvas.width,100);
 ctx.textAlign="center";
 ctx.fillStyle="#e9c15a";
 ctx.font="bold 42px Arial";
 ctx.fillText("GVR MART",canvas.width/2,canvas.height-55);
 ctx.fillStyle="white";
 ctx.font="22px Arial";
 ctx.fillText("SCAN • SNAP • SHARE",canvas.width/2,canvas.height-20);

 result.src=canvas.toDataURL("image/png");
 result.hidden=false;
}

function downloadPhoto(){
 if(result.hidden){alert("Take selfie first!");return;}
 const a=document.createElement("a");
 a.href=result.src;
 a.download="GVR-MART-Selfie.png";
 a.click();
}

async function sharePhoto(){
 if(result.hidden){alert("Take selfie first!");return;}
 const blob=await (await fetch(result.src)).blob();
 const file=new File([blob],"GVR-MART-Selfie.png",{type:"image/png"});
 if(navigator.canShare && navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:"GVR MART Selfie"});}
  catch(e){}
 }else{
  downloadPhoto();
  alert("Photo downloaded. Share from gallery!");
 }
}
</script>
</body>
</html>
